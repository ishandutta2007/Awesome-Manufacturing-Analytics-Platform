<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{r:4px;opacity:.6}}@keyframes grow{0%{transform:scaleY(.6)}}.pulse-line{stroke-dasharray:800;stroke-dashoffset:800;animation:dash 6s linear infinite}.pulse-node{animation:pulse 2s ease-in-out infinite alternate}.bar-anim{transform-origin:bottom;animation:grow 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="320" fill="none" stroke="url(#accent-grad)" stroke-opacity=".4" stroke-width="2" rx="16"/><g opacity=".25"><path stroke="#334155" stroke-dasharray="4 4" stroke-width="1" d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/><path stroke="#334155" stroke-dasharray="4 4" stroke-width="1" d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320"/><path fill="url(#glow-grad)" d="M 50 250 Q 200 180, 400 220 T 750 140 T 1150 90 L 1150 300 L 50 300 Z"/><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M 50 250 Q 200 180, 400 220 T 750 140 T 1150 90" class="pulse-line" filter="url(#glow)"/><circle cx="200" cy="200" r="5" fill="#a855f7" class="pulse-node"/><circle c