<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: dash 6s linear infinite;
      }
      .pulse-node {
        animation: pulse 2s ease-in-out infinite alternate;
      }
      .bar-anim {
        transform-origin: bottom;
        animation: grow 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.6; }
        100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 6px #a855f7); }
      }
      @keyframes grow {
        0% { transform: scaleY(0.6); }
        100% { transform: scaleY(1.05); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="16" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Dynamic Tech Mesh / Graph Background (placed behind text) -->
  <g opacity="0.25">
    <!-- Grid -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Animated Chart Area -->
    <path d="M 50 250 Q 200 180, 400 220 T 750 140 T 1150 90 L 1150 300 L 50 300 Z" fill="url(#glow-grad)" />
    <path class="pulse-line" d="M 50 250 Q 200 180, 400 220 T 750 140 T 1150 90" fill="none" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)"/>

    <!-- Nodes -->
    <circle class="pulse-node" cx="200" cy="200" r="5" fill="#a855f7"/>
    <circle class="pulse-node" cx="400" cy="220" r="5" fill="#6366f1"/>
    <circle class="pulse-node" cx="750" cy="140" r="5" fill="#ec4899"/>
    <circle class="pulse-node" cx="950" cy="115" r="5" fill="#38bdf8"/>
  </g>

  <!-- Decorative Analytics Visual (Right Side) -->
  <g transform="translate(900, 120)" opacity="0.4">
    <rect class="bar-anim" x="0" y="40" width="16" height="80" rx="4" fill="#6366f1"/>
    <rect class="bar-anim" x="28" y="10" width="16" height="110" rx="4" fill="#a855f7" style="animation-delay: 0.5s"/>
    <rect class="bar-anim" x="56" y="60" width="16" height="60" rx="4" fill="#ec4899" style="animation-delay: 1s"/>
    <rect class="bar-anim" x="84" y="25" width="16" height="95" rx="4" fill="#38bdf8" style="animation-delay: 1.5s"/>
  </g>

  <!-- Foreground Content (Always on top) -->
  <g text-anchor="middle">
    <!-- Icon / Tag -->
    <rect x="490" y="45" width="220" height="32" rx="16" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5"/>
    <text x="600" y="66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">🏭 INDUSTRIAL AI &amp; IIoT</text>

    <!-- Title -->
    <text x="600" y="140" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
      Awesome Manufacturing Analytics Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Ecosystem for OEE, Machine Data, Predictive Maintenance &amp; Shop-Floor Intelligence
    </text>

    <!-- Pills / Badges in Banner -->
    <g transform="translate(360, 225)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 OEE &amp; KPIs</text>

      <rect x="145" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="235" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🛠️ Predictive Maintenance</text>

      <rect x="340" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="410" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Open Source</text>
    </g>
  </g>
</svg>
